<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Grenco Medical Brand & Product Assets Portal</title>
  <meta name="description" content="Official Grenco Medical Elite II product and brand assets for pharmacies, partners, and press — product photography, brand logos, videos, and documents, ready to download." />

  <!-- Social link previews (shown when the portal URL is shared) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Grenco Medical Brand &amp; Product Assets Portal" />
  <meta property="og:title" content="Grenco Medical Brand &amp; Product Assets Portal" />
  <meta property="og:description" content="Official Elite II product and brand assets for pharmacies, partners, and press — organized and ready to download." />
  <meta property="og:url" content="https://assets.grencomedical.com/" />
  <meta property="og:image" content="https://assets.grencomedical.com/assets/share-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Grenco Medical — Brand &amp; Product Assets Portal" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Grenco Medical Brand &amp; Product Assets Portal" />
  <meta name="twitter:description" content="Official Elite II product and brand assets for pharmacies, partners, and press." />
  <meta name="twitter:image" content="https://assets.grencomedical.com/assets/share-card.png" />

  <!-- Theme color (matches grencomedical.com teal header) -->
  <meta name="theme-color" content="#134746" />

  <!-- Fonts: same faces grencomedical.com loads — Marcellus + Marcellus Sans (display),
       DM Sans (body), Poppins (accent headings) -->
  <!-- Favicon + apple-touch-icon (relative so they resolve on both the project
       URL and the custom assets.grencomedical.com domain) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Cache-busting: stamp a fresh version each load so edits show up on a normal
       refresh (no hard-refresh needed). Content-hashed images still cache normally. -->
  <script>document.write('<link rel="stylesheet" href="assets/css/styles.css?v=' + Date.now() + '">');</script>
  <noscript><link rel="stylesheet" href="assets/css/styles.css" /></noscript>
</head>
<body>
  <h1 class="sr-only">Grenco Medical Brand &amp; Product Assets Portal</h1>

  <!-- NAV -->
  <header class="nav">
    <div class="wrap nav-inner">
      <div class="brandmark" id="home-link" role="button" tabindex="0" aria-label="Grenco Medical Assets Portal, home">
        <span class="sq"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg></span>
        <span class="lib">Grenco Medical Assets Portal</span>
      </div>
      <div class="nav-search" id="nav-search">
        <svg class="nav-search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="gsearch" class="nav-search-input" type="text" placeholder="Search assets…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="gs-list" aria-autocomplete="list" aria-label="Search all Elite II assets" />
        <kbd class="nav-search-kbd" aria-hidden="true">/</kbd>
        <button id="gsearch-clear" class="nav-search-clear" type="button" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <!-- The listbox owns option elements only; the empty state and the footer
             are siblings so assistive tech reads a clean result list. -->
        <div class="gs-pop" id="gs-pop" hidden>
          <div id="gs-list" role="listbox" aria-label="Search results"></div>
          <div class="gs-empty" id="gs-empty" hidden></div>
          <div class="gs-foot" id="gs-foot" hidden></div>
        </div>
      </div>
      <div id="gs-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="nav-actions">
        <button class="nav-link" id="nav-guides">Logos &amp; assets</button>
        <a class="req-link req-mail" href="#" aria-label="Request an asset"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>Request an asset</span></a>
      </div>
    </div>
  </header>

  <!-- HERO (compact brand band) — home only -->
  <section class="hero" id="hero">
    <div class="wrap">
      <div class="hero-brands">
        <img class="hero-logo grencomedical" src="assets/logos/grenco-medical-logo-white.svg" alt="Grenco Medical" />
      </div>
      <h1 class="hero-title">Brand and Product Assets</h1>
    </div>
  </section>


  <!-- BODY -->
  <main class="wrap body">
    <div id="home">
    </div>

    <div id="detail" class="detail" style="display:none;"></div>
    <div id="styleguide" class="detail" style="display:none;"></div>
    <div id="additional" class="detail" style="display:none;"></div>
    <div id="materials-page" class="detail" style="display:none;"></div>
    <div id="locator-page" class="detail" style="display:none;"></div>
    <div id="training-page" class="detail" style="display:none;"></div>
  </main>

  <!-- FOOTER -->
  <footer class="foot">
    <div class="wrap foot-inner">
      <span class="l">Pharmacy, partner &amp; press asset requests welcome. Assets update as new materials are added.</span>
      <nav class="foot-links">
        <a class="foot-link req-mail" href="#">Request an asset →</a>
      </nav>
    </div>
  </footer>

  <!-- LIGHTBOX / ASSET VIEWER -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Asset preview">
    <button class="lb-close" id="lb-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="lb-stage"><img src="" alt="Asset preview" /></div>
    <div class="lb-bar">
      <div class="lb-meta"><span class="lb-name" id="lb-name"></span><span class="lb-count" id="lb-count"></span></div>
      <div class="lb-acts">
        <button class="btn ghost sm" id="lb-copy"></button>
        <button class="btn sm" id="lb-dl"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Floating scroll-to-top (shown after scrolling down) -->
  <button class="to-top" id="to-top" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </button>

  <!-- Ordered, cache-busted load (synced → assets → app). Fresh code every refresh. -->
  <script>
    (function () {
      var v = Date.now();
      ["assets/data/synced.js", "assets/data/assets.js", "assets/js/app.js"].forEach(function (src) {
        document.write('<script src="' + src + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
